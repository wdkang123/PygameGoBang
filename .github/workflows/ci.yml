name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: |
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          mypy src
      - name: Format check
        run: |
          black --check src tests scripts
      - name: Test
        run: |
          pytest -q
      - name: Smoke test
        run: |
          python -c "from pygobang import core, ai, replay; print('import ok')"
          python -c "from pygobang.core import Game, Board, Rules; g=Game(); print('core ok')"
          python -c "from pygobang.ai import RandomBot, HeuristicBot; print('ai ok')"
